# Espejo opcional para Gitea Actions.
# Requiere un runner compatible con actions/checkout y actions/setup-go.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -tags=nodynamic
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true

      - name: CI
        run: make ci
