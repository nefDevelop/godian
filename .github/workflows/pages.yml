name: Deploy to GitHub Pages

# Manual: el sitio canónico se despliega en Cloudflare Pages.
# Para GitHub Pages, ajusta site.url/base_path a la URL de Pages antes de
# ejecutarlo; si no, los enlaces apuntarán al dominio de Cloudflare.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"

      - name: Build generator
        run: GOFLAGS=-tags=nodynamic CGO_ENABLED=0 go build -o bin/godian ./cmd/godian

      - name: Generate site
        run: ./bin/godian build -config site.yaml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
