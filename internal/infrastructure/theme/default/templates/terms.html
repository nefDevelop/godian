{{define "terms"}}{{ template "head" . }}{{ template "header" . }}
<div class="wrap">
	<h1>{{ .Title }}</h1>
	{{ if .Description }}<p class="muted">{{ .Description }}</p>{{ end }}
	<div class="terms">
		{{ range .Terms }}<a class="term" href="{{ .URL }}"><span class="term-name">{{ .Name }}</span><span class="term-count">{{ .Count }}</span></a>{{ end }}
	</div>
</div>
{{ template "footer" . }}{{ end }}
