<div class="progress" data-value="{{ if .value }}{{ .value }}{{ else }}0{{ end }}" data-max="{{ if .max }}{{ .max }}{{ else }}100{{ end }}">
	{{ if .label }}<div class="progress-label">{{ .label }}</div>{{ end }}
	<div class="progress-track"><div class="progress-bar" role="progressbar" style="width:0"></div></div>
</div>
