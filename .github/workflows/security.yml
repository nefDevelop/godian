name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

env:
  GOFLAGS: -tags=nodynamic
  CGO_ENABLED: "0"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # >= 1.27.2 corrige las vulnerabilidades de stdlib detectadas por govulncheck.
          go-version: "1.27.2"
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: gosec
        run: make gosec
