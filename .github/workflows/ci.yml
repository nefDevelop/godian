name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # El sitio usa el tag nodynamic; -race necesita cgo en el runner.
      GOFLAGS: -tags=nodynamic
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # >= 1.27.2 corrige vulnerabilidades de stdlib (html/template, net/http2).
          go-version: "1.27.2"
          cache: true

      - name: CI
        run: make ci
