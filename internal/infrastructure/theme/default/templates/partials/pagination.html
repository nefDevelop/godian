{{define "pagination"}}{{ if gt .Page.Last 1 }}<nav class="pagination">
	{{ if .Page.HasPrev }}<a class="page-nav" href="{{ .Page.PrevURL }}">{{ t "ui.prev" }}</a>{{ end }}
	<span class="page-links">
		{{ range .Page.Pages }}<a class="page-link{{ if eq . $.Page.Current }} is-current{{ end }}" href="{{ $.Page.BaseURL }}{{ if gt . 1 }}{{ . }}/{{ end }}">{{ . }}</a>{{ end }}
	</span>
	{{ if .Page.HasNext }}<a class="page-nav" href="{{ .Page.NextURL }}">{{ t "ui.next" }}</a>{{ end }}
</nav>{{ end }}{{ end }}
