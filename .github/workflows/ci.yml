name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GOFLAGS: -tags=nodynamic
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # >= 1.27.2 corrige vulnerabilidades de stdlib (html/template, net/http2).
          go-version: "1.27.2"
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./tools)"

      - name: vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...
