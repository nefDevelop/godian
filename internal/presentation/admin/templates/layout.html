{{ define "layout" -}}
<!doctype html>
<html lang="{{ .Lang }}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="admin-csrf" content="{{ .CSRF }}">
	<title>{{ .Title }} · {{ .Site.Title }}</title>
	<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.classList.add(t);}catch(e){}</script>
	{{ range .ThemeCSS }}<link rel="stylesheet" href="{{ . }}">
	{{ end }}{{ if .FontsCSS }}<link rel="stylesheet" href="{{ .FontsCSS }}">
	{{ end }}<link rel="stylesheet" href="/admin/assets/admin.css">
	{{ if .ThemeAdminCSS }}<link rel="stylesheet" href="{{ .ThemeAdminCSS }}">
	{{ end }}</head>
<body class="admin-body">
	<header class="admin-header">
		<a class="admin-brand" href="/admin/">
			<span class="admin-brand-mark">{{ icon "layout-dashboard" }}</span>
			<span class="admin-brand-title">{{ .Site.Title }}</span>
			<span class="admin-brand-sub">Admin</span>
		</a>
		<nav class="admin-nav" aria-label="Admin">
			<a href="/admin/">Contenido</a>
			<a href="/" target="_blank" rel="noopener">Ver sitio</a>
			<button type="button" class="admin-theme-toggle" data-theme-toggle aria-label="Cambiar tema">{{ icon "moon" }}</button>
		</nav>
	</header>
	<main class="admin-main">
		{{ template "content" . }}
	</main>
	<script src="/admin/assets/admin.js" defer></script>
</body>
</html>
{{- end }}
