{{define "header"}}<a class="skip-link" href="#main-content">{{ t "ui.skip" }}</a>
<header class="site-header">
	<div class="wrap header-inner">
		<a class="brand" href="/">{{ .Site.Title }}</a>
		<button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">{{ icon "menu" }}</button>
		<nav class="site-nav" id="site-nav" aria-label="{{ t "ui.nav_main" }}">
			{{ range .Nav }}{{ if .Children }}<div class="nav-group">
				{{ if .URL }}<a class="nav-parent" href="{{ .URL }}">{{ .Label }}</a>{{ else }}<span class="nav-parent">{{ .Label }}</span>{{ end }}
				<div class="nav-sub">{{ range .Children }}<a href="{{ .URL }}">{{ .Label }}</a>{{ end }}</div>
			</div>{{ else }}<a href="{{ .URL }}"{{ if eq .URL $.NavActive }} aria-current="page"{{ end }}>{{ .Label }}</a>{{ end }}{{ end }}
			<a class="nav-search" href="/search/">{{ t "ui.search" }}</a>
			<button class="theme-toggle" type="button" aria-label="Toggle theme">{{ icon "sun-moon" }}</button>
		</nav>
	</div>
</header>
{{ template "searchmodal" . }}
<main class="site-main" id="main-content">
{{end}}
